<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Us</title>
    <meta name="author" content="Mpho Rakgope">
    <meta name="description"
      content="About our white water rafting company. See footer for bookings, packages, and social links.">
    <link rel="stylesheet" href="styles/rafting.css">
</head>

<body>
    <header>
        <img src="images/wwr-logo.png" alt="Business Logo">
        <nav>
            <ul>
                <li><a href="index.html">Home</a></li>
                <li><a href="about.html">About Us</a></li>
                <li><a href="trips.html">Trips</a></li>
                <li><a href="contact.html">Contact Us</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <section class="contact">
            <h1>Contact Us</h1>

            <h2>White Water Rafting Company</h2>
            <p>123 Main River Street</p>
            <p>Kolob, California</p>
            <p>+1 (999) 999-9999</p>
            <p>info@whitewater.com</p>

            <div class="contact-container">

                <!-- Google Map -->
                <section class="map">
                    <iframe
                      src="https://www.google.com/maps/embed?pb=https://maps.app.goo.gl/AXVaGDs9KjyQ3NBfA"
                      width="100%" height="400" style="border:0;" loading="lazy" allowfullscreen
                      referrerpolicy="no-referrer-when-downgrade">
                    </iframe>
                </section>

                <!-- Contact Form -->
                <form class="contact-form" action="#" method="post">

                    <div class="form-group">
                        <label for="name">Name</label>
                        <input type="text" id="name" name="name" placeholder="John Doe" required>
                    </div>

                    <div class="form-group">
                        <label for="email">Email</label>
                        <input type="email" id="email" name="email" placeholder="john@example.com"
                          required>
                    </div>

                    <div class="form-group">
                        <label>Message Purpose</label>

                        <div class="radio-group">

                            <label for="general">
                                <input type="radio" id="general" name="subject"
                                  value="General Inquiry" checked>
                                General Inquiry
                            </label>

                            <label for="reservation">
                                <input type="radio" id="reservation" name="subject"
                                  value="Reservation Question">
                                Reservation Question
                            </label>

                            <label for="website">
                                <input type="radio" id="website" name="subject"
                                  value="Website Suggestion">
                                Website Suggestion
                            </label>

                        </div>
                    </div>

                    <div class="form-group">
                        <label for="message">Message</label>

                        <textarea id="message" name="message" rows="5"
                          placeholder="Type your message here..." required></textarea>
                    </div>

                    <div class="checkbox">
                        <label for="subscribe">
                            <input type="checkbox" id="subscribe" name="subscribe">
                            Please subscribe me to the monthly newsletter.
                        </label>
                    </div>

                    <button type="submit">Get in Touch!</button>

                </form>

            </div>
        </section>

        <!-- Employee Profiles -->
        <section class="employee-profile">

            <h2>We Are Here to Serve You</h2>

            <figure>
                <img src="images/river-rafting-hazyview.jpg" alt="Lead River Guide">
                <figcaption>Lead River Guide</figcaption>
            </figure>

            <figure>
                <img src="images/river-rafting-in-nepal.jpg" alt="Reservation Specialist">
                <figcaption>Reservation Specialist</figcaption>
            </figure>

            <figure>
                <img src="images/rafting.jpg" alt="Adventure Coordinator">
                <figcaption>Adventure Coordinator</figcaption>
            </figure>

        </section>
    </main>
    <footer>
        <p>© 2026 White Water Rafting Mpho Rakgope</p>
        <nav class="socialmedia">
            <a href="https://www.linkedin.com"><img src="images/linkedin.svg" alt="LinkedIn Icon"
                  width="50"></a>
            <a href="https://www.Facebook.com"><img src="images/facebook.svg" alt="Facebook Icon"
                  width="45"></a>
            <a href="https://www.tiktok.com"><img src="images/tictok.svg" alt="tictoc Icon"
                  width="40"></a>
        </nav>
    </footer>
</body>

</html>
