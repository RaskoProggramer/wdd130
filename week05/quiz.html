<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quiz</title>
    <link rel="stylesheet" href="styles/quiz.css">
</head>

<body>
    <form>
        <label for="q1">1. What does the acronym CSS stands for?</label>
        <input type="text" id="q1" name="q1">
        <label for="q2">2. How are id and class attributes selected in CSS?</label>
        <textarea for="q2" name="q2" rows="4"></textarea>
        <label for="q3">3. Which of the following is a valid CSS comment?</label>
        <select id="q3" name="q3">
            <option value="Python comment">#comment</option>
            <option value="CSS comment">/* comment */</option>
            <option value="HTML comment"><!-- commment --></option>
        </select><br>
        <label for="q4">4. What is the bottom margin gives this declaration?</label>
        <p>margin: 10px 5px 15px;</p>
        <input type="text" id="q4" name="q4">
        <button type="submit">Submit Quiz</button>
    </form>
</body>

</html>
